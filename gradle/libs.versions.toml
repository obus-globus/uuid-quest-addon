# The LiquidBounce add-on: keep `minecraft`, `fabric-loom` and `kotlin` in sync with the LiquidBounce
# release you target. A mismatch is the usual cause of an add-on that compiles but crashes at runtime.
# The Fabric mod's per-version dependencies live in fabric/versions/<node>/gradle.properties.
[versions]
detekt = "2.0.0-alpha.6"
jdk = "25"

minecraft = "26.3"
# Also builds the Fabric mod, as `fabric-loom` (26.x) or `fabric-loom-remap` (obfuscated versions).
fabric-loom = "1.19-SNAPSHOT"

kotlin = "2.4.20"

# The add-on compiles against the client itself; there is no separate API artifact.
# Use `<version>+<mc>` for a release or `<version>+<mc>-SNAPSHOT` to track main.
liquidbounce = "0.42.0+26.3"

# The oldest Gson any supported Minecraft ships (1.20.1), so core uses no newer API.
gson = "2.10"
junit = "6.1.3"

[libraries]
minecraft = { group = "com.mojang", name = "minecraft", version.ref = "minecraft" }
liquidbounce = { group = "net.ccbluex", name = "liquidbounce", version.ref = "liquidbounce" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }

[plugins]
# Same version and configs (config/detekt, copied from LiquidBounce) as the client the add-on targets.
detekt = { id = "dev.detekt", version.ref = "detekt" }
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabric-loom" }
fabric-loom-remap = { id = "net.fabricmc.fabric-loom-remap", version.ref = "fabric-loom" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
