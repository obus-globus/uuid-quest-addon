name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    # published: attach the jars (releases and pre-releases).
    # released: upload to the marketplace (a release, or a pre-release promoted to one).
    types: [ published, released ]
  workflow_dispatch:

# The build runs third-party Gradle plugins, so it only reads; the jobs that publish get their own rights.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      # The Fabric jars build against Java 17, 21 and 25; the last one listed runs Gradle.
      - name: Setting up JDKs
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: |
            17
            21
            25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      # Runs core's tests and builds the add-on and every Fabric node; collectJars puts the jars in build/libs.
      - name: Build
        run: >-
          ./gradlew build collectJars
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: jars
          path: build/libs/*.jar

  snapshot:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Two quick pushes must not race on deleting and recreating the snapshot.
    concurrency:
      group: snapshot
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: jars
          path: jars
      - name: Publish snapshot release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          mapfile -t JARS < <(find jars -maxdepth 1 -name '*.jar' | sort)
          [ "${#JARS[@]}" -gt 0 ] || { echo "[ERROR] no jar in the artifact" >&2; exit 1; }

          NOTES="Automatic build of \`${GITHUB_SHA::7}\` from \`main\`.

          Not a stable release - it tracks whatever is on main right now."

          # Recreate rather than edit: `gh release upload --clobber` cannot retarget the tag when
          # main has moved on.
          gh release delete snapshot --cleanup-tag --yes || true
          gh release create snapshot "${JARS[@]}" \
            --title "Snapshot" \
            --notes "$NOTES" \
            --prerelease \
            --target "$GITHUB_SHA"

  release-assets:
    needs: build
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: jars
          path: jars
      - name: Attach jars to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          # The tag names the version the add-on jar was built as, e.g. v1.0.0+26.3
          ADDON="jars/uuid-quest-addon-${TAG#v}.jar"
          [ -f "$ADDON" ] || { echo "[ERROR] no $ADDON, check mod_version and minecraft against the tag $TAG" >&2; exit 1; }

          mapfile -t JARS < <(find jars -maxdepth 1 -name '*.jar' | sort)
          gh release upload "$TAG" "${JARS[@]}" --clobber

  marketplace:
    needs: build
    if: github.event_name == 'release' && github.event.action == 'released' && vars.MARKETPLACE_ITEM_ID != ''
    runs-on: ubuntu-latest
    # Only this job can ask GitHub for the identity token the marketplace trusts.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: jars
          path: jars
      - name: Publish to the marketplace
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          ITEM_ID: ${{ vars.MARKETPLACE_ITEM_ID }}
          VERSION: ${{ github.event.release.tag_name }}
          CHANGELOG: ${{ github.event.release.body }}
          SOURCE_RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          set -euo pipefail
          # Only the LiquidBounce add-on goes to the marketplace, not the standalone Fabric jars.
          JAR="jars/uuid-quest-addon-${VERSION#v}.jar"
          [ -f "$JAR" ] || { echo "[ERROR] no $JAR, check mod_version and minecraft against the tag $VERSION" >&2; exit 1; }
          # The client unpacks a revision and expects exactly one jar at its root.
          zip -j addon.zip "$JAR"
          # Trusted publishing: item 894 accepts GitHub's identity token from this repository's tag runs of
          # build.yml. The API_TOKEN secret, if set, is used instead.
          if [ -n "${API_TOKEN:-}" ]; then
            AUTH="$API_TOKEN"
          else
            AUTH=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.liquidbounce.net" | jq -r .value)
          fi
          # --form-string: -F would read a release body starting with @ as a file path.
          curl --fail-with-body -X POST \
            "https://api.liquidbounce.net/marketplace/items/$ITEM_ID/revisions" \
            -H "Authorization: Bearer $AUTH" \
            -F "file=@addon.zip" \
            --form-string "version=$VERSION" \
            --form-string "changelog=$CHANGELOG" \
            --form-string "sourceRepository=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --form-string "sourceRef=$GITHUB_REF" \
            --form-string "sourceCommit=$GITHUB_SHA" \
            --form-string "sourceReleaseTag=$VERSION" \
            --form-string "sourceReleaseUrl=$SOURCE_RELEASE_URL" \
            --form-string "sourceBuildUrl=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
