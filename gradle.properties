kotlin.code.style=official
org.gradle.daemon=true
# One Loom project at a time keeps the build within a shared machine's memory.
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.jvmargs=-Xmx3g

mod_version=1.0.1
maven_group=quest.uuid

# Fabric mod: the loader used to build and run every node (the jar accepts older ones, see mod.loader_min).
deps.fabric_loader=0.20.1
